
default_install_hook_types: [pre-commit, pre-push, commit-msg]
exclude: '^src/exposition/'

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
        - id: trailing-whitespace
        - id: end-of-file-fixer
        - id: check-yaml
        - id: check-added-large-files
        - id: check-toml
    - repo: https://github.com/commitizen-tools/commitizen
      rev: v4.13.10
      hooks:
        - id: commitizen
          stages: [commit-msg]
        - id: commitizen-branch
          stages: [pre-push]
    - repo: https://github.com/fpgmaas/deptry.git
      rev: "0.25.1"
      hooks:
        - id: deptry
          args:
            [
              --ignore,
              "DEP001,DEP003",
              --per-rule-ignores,
              "DEP002=dbt-core|fsspec|dbt-duckdb",
            ]
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.10
      hooks:
        - id: ruff # `ruff check`
          args: [ --fix ]
        - id: ruff-format # `ruff format`
    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v1.20.1
      hooks:
        - id: mypy
          verbose: true
          args: [ --install-types, --non-interactive, --pretty, --disallow-untyped-defs, --strict-equality,  --warn-no-return, --ignore-missing-imports, --no-namespace-packages]
    - repo: local
      hooks:
        - id: sqlfluff-fix
          name: sqlfluff-fix
          entry: bash -lc 'set -a && source .env && set +a && uv run sqlfluff fix --config .sqlfluff "$DBT_PROJECT_DIR"'
          language: system
          pass_filenames: false
          files: ^src/transformation/dbt_paris_event_analyzer/.*\.sql$
        - id: sqlfluff-lint
          name: sqlfluff-lint
          entry: bash -lc 'set -a && source .env && set +a && uv run sqlfluff lint --config .sqlfluff "$DBT_PROJECT_DIR"'
          language: system
          pass_filenames: false
          files: ^src/transformation/dbt_paris_event_analyzer/.*\.sql$
