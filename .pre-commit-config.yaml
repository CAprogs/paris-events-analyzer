repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
        - id: trailing-whitespace
        - id: end-of-file-fixer
        - id: check-yaml
        - id: check-added-large-files
        - id: check-toml

    - repo: https://github.com/commitizen-tools/commitizen
      rev: v4.9.1
      hooks:
        - id: commitizen
          stages: [commit-msg]
        - id: commitizen-branch
          stages: [pre-push]

    - repo: http://github.com/fpgmaas/deptry.git
      rev: "0.23.1"
      hooks:
        - id: deptry
          args: [--ignore, DEP001]
